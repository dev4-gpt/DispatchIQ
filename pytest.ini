[pytest]
# Collect only the research and backend suites. runs/ holds generated output (and some
# leftover temp folders that are not readable on every machine), so never recurse into it.
testpaths = tests backend/tests
norecursedirs = runs frontend .venv .git __pycache__ node_modules
# The root .pytest_cache is not writable on some machines; keep the cache under ignored runs/.
cache_dir = runs/pytest-cache
